   const w=r.delay-t;if(w<.5){const j=(1-w/.5)*(intro?1.2:.8);m.position.x+=(Math.random()-.5)*j;m.position.y+=(Math.random()-.5)*j;m.position.z+=(Math.random()-.5)*j}
   continue}
  if(!r.go){r.go=true;r.sp.copy(m.position);if(Math.random()<.7)spawnPuff(r.sp.x,Math.max(r.sp.y,1),r.sp.z,5+Math.random()*7)}
  started++;targetOf(e);const k=easeSS(u),arc=Math.sin(Math.PI*u);
  _ap.copy(r.sp).lerp(_tp,k);const tx=-(_ap.z-cz),tz=_ap.x-cx,tl=Math.hypot(tx,tz)||1;
  _ap.x+=tx/tl*arc*r.sw;_ap.z+=tz/tl*arc*r.sw;_ap.y+=arc*r.arc;
  m.position.copy(_ap);m.quaternion.copy(r.sq).slerp(_tq,k);m.scale.copy(r.ss).lerp(_ts,k);
  if(u>=1){if(Math.random()<.5)emit(_tp,2,6,4);finishRock(r);fin++}}
 AS.started=started;
 trauma=Math.max(trauma,.2+.3*prog);
 AS.wv-=dt;if(AS.wv<=0){AS.wv=.8;_cw.set(cx,0,cz);wave(_cw,intro?70:50,intro?0xffaa66:0xffcc66,1.4,1.2)}
 if(AS.dur>5||!intro){
  if(!AS.t1&&t>.4){AS.t1=1;cinText(intro?'Tanah bergetar…':'Relief kuno bergema…',2000)}
  if(!AS.t2&&t>AS.dur*.36){AS.t2=1;cinText(intro?'Batu-batu purba terbangun…':'Reruntuhan menyatu kembali…',2200)}}
 if(fin===n&&t>.4){AS.on=false;onAssembled()}
}
function skipAssemble(){if(!AS.on)return;for(const r of AS.list)if(!r.done)finishRock(r);AS.on=false;onAssembled()}
function onAssembled(){
 const intro=AS.mode==='intro';
 head.traverse(o=>{if(o.isMesh)o.visible=true});core.visible=halo.visible=false;EYE.tgt=1;EYE.ign=1.1;
 mnt.visible=false;document.body.classList.remove('cin');$('skip').style.display='none';
 flash(.85);addShake(1.3);_cw.set(AS.cx,0,AS.cz);wave(_cw,90,0xffaa44,1.4,1.6);wave(_cw,55,0xffffff,.9);
 camSlow=1.6;fireHeld=false;
 if(intro){G.st='walk';G.cd=2.4;state='playing';cinText('TITAN GURUN',2400)}
 else{
  G.rev++;const q=Math.min(G.rev,3),nm='TITAN '+['','II','III','IV'][q];setEyeColor(EYE_COLS[q]);
  G.max=Math.round(C.gHP*(1+.25*q));G.hp=G.max;G.sp=1+.12*q;buffLook(q);$('tl').textContent=nm;
  Object.assign(G,{st:'rise',ph:'',t:1.9,cd:2,spd:0,amp:0,crawl:false,upright:true,nLeg:2,nArm:2,hurtLeg:false,blind:false,fell:false,core:false,bo:0,bt:0,cm:false});
  bodyStatus();for(const r of RELS){r.on=false;r.charge=0}
  pHP=Math.min(C.pHP,pHP+45);energy=100;hot=false;state='playing';cinText(nm+' BANGKIT!',2600)}
 bars()}
function startIntro(first){
 state='intro';G.st='intro';G.spd=0;G.pose=null;document.body.classList.add('cin');$('skip').style.display='';
 startAssemble('intro',first?7.5:2.8)}
function startRevive(){
 state='revive';hideBanner();document.body.classList.add('cin');$('skip').style.display='';
 for(const r of RELS)r.on=true;startAssemble('revive',5.5)}
function activateRelief(r){r.on=true;r.charge=1;flash(.35);addShake(.7);_cw.set(r.x,0,r.z);wave(_cw,28,0x66ddff,1.2,1.4);wave(_cw,16,0xffffff,.8);
 _ap.set(r.x,16,r.z);emit(_ap,30,14,10);updBanner();if(RELS.every(q=>q.on))revT=1}
function relUpdate(dt){
 relPulse+=dt;const win=state==='win'&&rvShown,rev=state==='revive',p=.5+.5*Math.sin(relPulse*3);
 for(let i=0;i<RELS.length;i++){const r=RELS[i];
  if(win&&!r.on){const d=Math.hypot(player.position.x-r.x,player.position.z-r.z);r.charge=clamp(r.charge+(d<12?dt/1.6:-dt/2),0,1);if(r.charge>=1)activateRelief(r)}
  const act=r.on||rev;
  r.gm.material.opacity=act?.95:win?.3+.25*p+r.charge*.5:.16;r.gm.material.color.setHex(act?0xffcc66:0x66ddff);
  r.ring.material.opacity=act?.8:win?.25+.35*p:.1;r.ring.material.color.setHex(act?0xffcc66:0x66ddff);
  r.fill.visible=r.charge>0&&!r.on;r.fill.scale.setScalar(Math.max(.001,r.charge));
  r.beam.visible=win||act;r.beam.material.opacity=act?.5+.2*p:.14+.1*p;r.beam.material.color.setHex(act?0xffcc66:0x66ddff);
  const b=RBEAM[i];b.visible=rev;
  if(rev){_ap.set(r.x,28,r.z);_tp.set(AS.cx,28,AS.cz);const L=_ap.distanceTo(_tp);_cw.copy(_tp).sub(_ap).normalize();b.position.copy(_ap).lerp(_tp,.5);b.quaternion.setFromUnitVectors(UP,_cw);b.scale.set(1+.3*Math.sin(relPulse*30+i),L,1+.3*Math.sin(relPulse*30+i))}}}
function winTick(dt){if(state!=='win')return;if(!rvShown){winT-=dt;if(winT<=0)showBanner()}if(revT>0){revT-=dt;if(revT<=0){revT=-1;startRevive()}}}
function resetGame(first=false){
 pHP=C.pHP;G.hp=C.gHP;energy=100;hot=false;fireHeld=false;
 player.position.set(0,0,18);player.rotation.y=Math.PI;player.dt=player.dc=0;
 golem.position.set(0,0,-85);golem.rotation.y=0;Object.assign(G,{st:'walk',ph:'',cd:2,spd:0,amp:0,pose:null,rate:5,max:C.gHP,rev:0,sp:1,crawl:false,upright:true,nLeg:2,nArm:2,hurtLeg:false,blind:false,fell:false,core:false,bo:0,bt:0,cw:0,cm:false});settleY=0;Object.assign(cur,REST);
 resetRocks();footReset();hideWarn();dashB.classList.remove('cd');trauma=0;camYaw=0;camPitch=-.25;camInit=false;$('ov').classList.add('h');
 hideBanner();winT=0;revT=-1;AS.on=false;EYE.lvl=EYE.tgt=0;setEyeColor(EYE_COLS[0]);for(const r of RELS){r.on=false;r.charge=0}buffLook(0);$('tl').textContent='TITAN';bars();startIntro(first)}
$('rs').addEventListener('click',()=>resetGame());$('rs2').addEventListener('click',()=>resetGame());
$('skip').addEventListener('pointerdown',e=>{e.preventDefault();skipAssemble()});
addEventListener('keydown',e=>{if(AS.on&&(e.code==='Space'||e.code==='Enter'))skipAssemble()});

let last=performance.now();
function animate(now){requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;
 if(state==='playing'){updatePlayer(dt);updateGolem(dt);updateLaser(dt)}else if(state==='win')updatePlayer(dt);
 heatTick(dt);looseTick(dt);collapseTick(dt);updDebris(dt);updAssemble(dt);winTick(dt);
 poseGolem(dt);updEyes(dt);relUpdate(dt);updWaves(dt);updSparks(dt);updateWorld();updateCamera(dt);checkEnd();xhEl.classList.toggle('h',state!=='playing');
 renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(joyId===null){jo={x:95,y:innerHeight-120};placeJB()}});
footReset();bodyStatus();bars();startIntro(true);requestAnimationFrame(animate);
